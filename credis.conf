# Sample credis configuration.
#
#   credis-server credis.conf
#   credis-server credis.conf --port 7000     # flags override the file
#
# The format matches redis.conf: one "name value" per line, '#' starts a comment,
# and values containing spaces may be quoted. Settings credis does not implement
# are accepted and ignored, so an existing redis.conf will usually load as-is.

# Address to accept connections on. Use '*' to listen on every interface —
# credis has no authentication, so only do that on a trusted network.
bind 127.0.0.1

# TCP port. 0 is not supported; credis is TCP-only (no Unix socket).
port 6379

# Backlog for listen(2). Values above /proc/sys/net/core/somaxconn are capped by
# the kernel.
tcp-backlog 511

# Number of databases, selectable with SELECT (0 .. databases-1).
databases 16

# Maximum simultaneous client connections. Further connections are rejected with
# "-ERR max number of clients reached". Keep this below the process's file
# descriptor limit (ulimit -n).
maxclients 10000

# How often background work runs, in Hz. 10 means serverCron ticks every 100ms.
# Raising it makes expiry collection more responsive at some CPU cost.
hz 10

# debug | verbose | notice | warning
loglevel notice

# Log destination. Empty means stderr; credis does not write log files itself.
logfile ""

# Working directory.
dir .

# --- accepted for compatibility, not implemented ---------------------------
# credis has no persistence, so these do nothing. They are listed because an
# existing redis.conf will contain them and must still load.
#
# appendonly no
# save ""
# daemonize no
# protected-mode yes
# maxmemory 0
